version: 2

registries:
  microsoft-public-npm:
    type: npm-registry
    url: https://ms-feed-25.pkgs.visualstudio.com/1es-public/_packaging/npm-public/npm/registry/

updates:
  # Python backend dependencies
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python
      - backend
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip:
        patterns:
          - "*"
        exclude-patterns:
          - "fastapi"
          - "openai"
        update-types:
          - "minor"
          - "patch"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    assignees:
      - idokatz86

  # Node.js frontend dependencies
  - package-ecosystem: npm
    directory: /frontend
    registries:
      - microsoft-public-npm
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
      - frontend
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-dev:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-prod:
        dependency-type: production
        patterns:
          - "*"
        exclude-patterns:
          - "react"
          - "react-dom"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # eslint-plugin-react@7.37.5 does not support ESLint 10 yet.
      # Keep only ESLint 10 parked until the React lint stack supports it.
      - dependency-name: "eslint"
        versions:
          - "10.x"
    assignees:
      - idokatz86

  # Supporting npm projects are independently installed and audited.
  - package-ecosystem: npm
    directories:
      - /
      - /frontend/api
    registries:
      - microsoft-public-npm
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-supporting:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directories:
      - /cli
      - /mcp-gateway
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip-supporting:
        patterns: ["*"]
        update-types: [minor, patch]

  # Docker base images
  - package-ecosystem: docker
    directories:
      - /backend
      - /mcp-gateway
    schedule:
      interval: weekly
      time: "06:00"
      timezone: "UTC"
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions versions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      time: "06:00"
      timezone: "UTC"
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci(deps)"
    groups:
      gh-actions:
        patterns:
          - "*"

  # Terraform providers
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
      time: "06:00"
      timezone: "UTC"
    labels:
      - dependencies
      - infrastructure
      - terraform
    commit-message:
      prefix: "chore(deps)"
    groups:
      azurerm:
        patterns:
          - "hashicorp/azurerm"
    assignees:
      - idokatz86
