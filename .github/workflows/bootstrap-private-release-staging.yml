name: Bootstrap private release staging

on:
  workflow_dispatch:
    inputs:
      owner_verified_absence:
        description: "I used owner-scoped read:packages access to verify both new staging names are absent"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: bootstrap-private-release-staging
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require explicit owner verification on main
        env:
          OWNER_VERIFIED_ABSENCE: ${{ inputs.owner_verified_absence }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_ACTOR" != "$GITHUB_REPOSITORY_OWNER" ] || \
            [ "$GITHUB_REF" != "refs/heads/main" ] || \
            [ "$OWNER_VERIFIED_ABSENCE" != "true" ]; then
            echo "::error::Owner-scoped namespace absence verification on main is required"
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Login for empty staging bootstrap
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Bootstrap only empty images and verify private ownership
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_BUILD_REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          python scripts/ensure_private_release_staging.py \
            --repository "$GITHUB_REPOSITORY" \
            --registry "$GHCR_BUILD_REGISTRY" \
            --owner-confirmed-absent
