name: Helm Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Reviewed Helm environment
        required: true
        type: choice
        options: [staging, production]
      image_repository:
        description: Container repository without tag or digest
        required: true
        type: string
      image_digest:
        description: Immutable sha256 image digest
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-backend-rollout
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Install release contract dependency
        run: python -m pip install pyyaml

      - name: Acquire cluster credentials
        run: az aks get-credentials --resource-group "$AKS_RESOURCE_GROUP" --name "$AKS_CLUSTER_NAME" --overwrite-existing
        env:
          AKS_RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP }}
          AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Run serialized atomic Helm release
        run: bash scripts/helm_release.sh
        env:
          HELM_RELEASE_NAME: archmorph
          HELM_NAMESPACE: ${{ vars.HELM_NAMESPACE || 'archmorph' }}
          HELM_VALUES_FILE: charts/archmorph/values-${{ inputs.environment }}.yaml
          HELM_IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          HELM_IMAGE_DIGEST: ${{ inputs.image_digest }}
          HELM_SOURCE_SHA: ${{ github.sha }}
          HELM_EVIDENCE_FILE: helm-release-evidence.json
          HELM_EXTERNAL_SECRETS_ENABLED: ${{ vars.HELM_EXTERNAL_SECRETS_ENABLED || 'false' }}
          HELM_EXTERNAL_SECRET_MANIFEST: ${{ vars.HELM_EXTERNAL_SECRET_MANIFEST }}
          HELM_EXTERNAL_SECRET_NAME: ${{ vars.HELM_EXTERNAL_SECRET_NAME }}
          HELM_EXISTING_SECRET_NAME: ${{ vars.HELM_EXISTING_SECRET_NAME }}

      - name: Upload Helm release evidence
        uses: actions/upload-artifact@v7
        with:
          name: helm-release-evidence
          path: helm-release-evidence.json
          if-no-files-found: error
          retention-days: 90
