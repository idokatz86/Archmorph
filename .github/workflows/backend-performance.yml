name: Backend Performance K6 Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  k6-load-test:
    name: "SLA Verification (CI: 30 RPS / Prod: 100 RPS)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      
      - name: Use fallback environment variables
        run: cp backend/.env.example backend/.env
      
      - name: Start Application Locally
        run: |
          # Use one production-shaped process, not the development file watcher.
          docker compose up -d postgres redis
          docker compose run -d \
            --name archmorph-k6-backend \
            --service-ports \
            backend \
            uvicorn main:app --host 0.0.0.0 --port 8000
          
          echo "Waiting for backend to stabilize..."
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/healthz >/dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl -fsS http://localhost:8000/healthz >/dev/null; then
            echo "Backend did not become healthy after $i attempts"
            docker logs archmorph-k6-backend
            exit 1
          fi
          docker compose ps
          
      - name: Run k6 Load Test
        run: |
          mkdir -p "${{ runner.temp }}/k6-summary"
          docker run --rm --network host -i \
            --user "$(id -u):$(id -g)" \
            -v ${{ github.workspace }}:/app:ro \
            -v "${{ runner.temp }}/k6-summary:/summary" \
            -w /app \
            -e API_BASE_URL="http://localhost:8000" \
            -e K6_SUMMARY_PATH="/summary/k6-summary.json" \
            -e CI=true \
            grafana/k6:0.49.0 run backend/tests/performance/api_load_test.js

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-k6-summary
          path: ${{ runner.temp }}/k6-summary/k6-summary.json
          if-no-files-found: ignore

      - name: Dump docker logs on failure
        if: failure()
        run: docker logs archmorph-k6-backend

      - name: Stop Application
        if: always()
        run: |
          docker rm -f archmorph-k6-backend >/dev/null 2>&1 || true
          docker compose down -v
