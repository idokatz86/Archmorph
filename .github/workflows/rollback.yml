name: Manual Rollback

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: 'Successful release workflow run containing the signed bridge manifest'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  CONTAINER_APP_NAME: ${{ secrets.CONTAINER_APP_NAME }}
  API_URL: ${{ secrets.API_URL }}
  ARCHMORPH_API_KEY: ${{ secrets.ARCHMORPH_API_KEY }}
  ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
  RELEASE_MANIFEST_HMAC_KEY: ${{ secrets.RELEASE_MANIFEST_HMAC_KEY }}

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    concurrency:
      group: production-backend-rollout
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve explicit signed bridge rollback target
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ github.event.inputs.release_run_id }}
        run: |
          set -euo pipefail
          if [ "${#RELEASE_MANIFEST_HMAC_KEY}" -lt 32 ]; then
            echo "::error::RELEASE_MANIFEST_HMAC_KEY must contain at least 32 bytes"
            exit 1
          fi
          gh run download "$RELEASE_RUN_ID" \
            --name backend-release-evidence \
            --dir release-evidence
          TARGET=$(python scripts/containerapp_rollout.py verify-release-manifest \
            --input release-evidence/bridge-release-manifest.json \
            --required-role bridge \
            --field revision)
          EXPECTED_IMAGE=$(python scripts/containerapp_rollout.py verify-release-manifest \
            --input release-evidence/bridge-release-manifest.json \
            --required-role bridge \
            --field image)
          ACTUAL_IMAGE=$(az containerapp revision show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "$TARGET" \
            --query properties.template.containers[0].image -o tsv)
          if [ "$ACTUAL_IMAGE" != "$EXPECTED_IMAGE" ]; then
            echo "::error::Signed bridge manifest does not match the retained revision image"
            exit 1
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Capture exact prior traffic and rollback target
        id: rollback_state
        env:
          ROLLBACK_TARGET: ${{ steps.revision.outputs.target }}
        run: |
          set -euo pipefail
          az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            -o json > containerapp-before-rollback.json
          az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --all \
            -o json > revisions-before-rollback.json
          jq '.properties.configuration.ingress.traffic' containerapp-before-rollback.json \
            > pre-rollback-traffic-original.json
          python scripts/containerapp_rollout.py explicit-traffic \
            --input pre-rollback-traffic-original.json \
            --container-app containerapp-before-rollback.json \
            --revisions revisions-before-rollback.json \
            --output pre-rollback-traffic-manifest.json
          cat > rollback-target-traffic-manifest.json <<EOF
          [{"revisionName":"${ROLLBACK_TARGET}","weight":100,"label":""}]
          EOF

      - name: Verify target schema compatibility before activation
        id: compatibility
        env:
          ROLLBACK_TARGET: ${{ steps.revision.outputs.target }}
        run: |
          set -euo pipefail
          REVISION_JSON=$(az containerapp revision show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "$ROLLBACK_TARGET" \
            -o json)
          TARGET_SCHEMA_MIN=$(echo "$REVISION_JSON" | jq -r \
            '.properties.template.containers[0].env[] | select(.name=="APP_SCHEMA_MIN_REVISION") | .value // ""')
          TARGET_SCHEMA_MAX=$(echo "$REVISION_JSON" | jq -r \
            '.properties.template.containers[0].env[] | select(.name=="APP_SCHEMA_MAX_REVISION") | .value // ""')
          TARGET_FQDN=$(echo "$REVISION_JSON" | jq -r '.properties.fqdn // ""')
          if [ -z "$TARGET_SCHEMA_MIN" ] || [ -z "$TARGET_SCHEMA_MAX" ] || [ -z "$TARGET_FQDN" ]; then
            echo "::error::Rollback target lacks APP_SCHEMA_MIN_REVISION, APP_SCHEMA_MAX_REVISION, or revision FQDN metadata"
            exit 1
          fi

          TARGET_ACTIVE=$(echo "$REVISION_JSON" | jq -r '.properties.active // false')
          TARGET_WEIGHT=$(echo "$REVISION_JSON" | jq -r '.properties.trafficWeight // 0')
          if [ "$TARGET_WEIGHT" != "0" ]; then
            echo "::error::Rollback target must start at zero traffic before direct compatibility smoke"
            exit 1
          fi
          if [ "$TARGET_ACTIVE" != "true" ]; then
            echo "Rollback target is inactive; activating it at zero traffic for schema preflight"
            az containerapp revision activate \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --revision "$ROLLBACK_TARGET"
          fi

          POST_ACTIVATION_WEIGHT=$(az containerapp revision show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "$ROLLBACK_TARGET" \
            --query properties.trafficWeight -o tsv)
          if [ "${POST_ACTIVATION_WEIGHT:-0}" != "0" ]; then
            echo "::error::Rollback target activation unexpectedly received traffic"
            exit 1
          fi

          COMPATIBILITY_CODE="000"
          for attempt in $(seq 1 20); do
            if ! COMPATIBILITY_CODE=$(curl -sS -o schema-compatibility.json -w "%{http_code}" \
              --max-time 30 "https://${TARGET_FQDN}/api/schema-compatibility"); then
              COMPATIBILITY_CODE="000"
            fi
            if [ "$COMPATIBILITY_CODE" = "200" ] || [ "$COMPATIBILITY_CODE" = "409" ]; then
              break
            fi
            if [ "$attempt" -lt 20 ]; then
              sleep 10
            fi
          done
          if [ "$COMPATIBILITY_CODE" != "200" ]; then
            echo "::error::Target revision schema preflight returned HTTP ${COMPATIBILITY_CODE}; traffic remains unchanged"
            [ -s schema-compatibility.json ] && cat schema-compatibility.json || true
            if [ "$TARGET_ACTIVE" != "true" ]; then
              az containerapp revision deactivate \
                --name "$CONTAINER_APP_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --revision "$ROLLBACK_TARGET" || true
            fi
            exit 1
          fi
          CURRENT_SCHEMA=$(jq -er '.current_revision' schema-compatibility.json)
          if ! jq -e --arg current "$CURRENT_SCHEMA" --arg minimum "$TARGET_SCHEMA_MIN" --arg maximum "$TARGET_SCHEMA_MAX" '
            .status == "compatible"
            and .current_revision == $current
            and (.accepted_revisions | index($current) != null)
            and .minimum_revision == $minimum
            and .maximum_revision == $maximum
          ' schema-compatibility.json >/dev/null; then
            echo "::error::Target revision is incompatible with the current database schema; traffic remains unchanged"
            if [ "$TARGET_ACTIVE" != "true" ]; then
              az containerapp revision deactivate \
                --name "$CONTAINER_APP_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --revision "$ROLLBACK_TARGET" || true
            fi
            exit 1
          fi
          echo "Rollback target supports current schema ${CURRENT_SCHEMA}; activation may proceed"

      - name: Activate rollback revision
        run: |
          az containerapp revision activate \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --revision ${{ steps.revision.outputs.target }}

      - name: Shift traffic to rollback revision
        id: shift_rollback
        env:
          ROLLBACK_TARGET: ${{ steps.revision.outputs.target }}
        run: |
          set -euo pipefail
          touch rollback-shift-attempted
          python scripts/containerapp_rollout.py apply-traffic \
            --input rollback-target-traffic-manifest.json \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --actual-output rollback-routed-traffic.json
          echo "Shifted 100% traffic to $ROLLBACK_TARGET"

      - name: Verify rollback health
        id: verify_rollback
        run: |
          set -euo pipefail
          echo "Waiting 30s for revision to stabilize..."
          sleep 30
          BASE="${API_URL%/}"
          BASE="${BASE%/api}"
          if ! curl -fsS --max-time 30 "${BASE}/readyz" >/dev/null; then
            echo "::error::Bridge readiness check failed after rollback"
            exit 1
          fi
          if ! curl -fsS --max-time 30 "${BASE}/api/schema-compatibility" \
            | jq -e '.status == "compatible" and .release_role == "bridge"' >/dev/null; then
            echo "::error::Bridge schema compatibility check failed after rollback"
            exit 1
          fi
          HEALTH_API_KEY="${ARCHMORPH_API_KEY:-${ADMIN_KEY:-}}"
          if ! HTTP_CODE=$(curl -sS --max-time 30 \
            -H "X-API-Key: ${HEALTH_API_KEY}" \
            -o bridge-read-only.json -w "%{http_code}" "${BASE}/api/health"); then
            echo "::error::Bridge read-only check failed after rollback"
            exit 1
          fi
          [ "$HTTP_CODE" = "503" ]
          jq -e '.status == "bridge_read_only" and .retryable == true' bridge-read-only.json >/dev/null
          echo "Rollback successful — signed bridge is ready, schema-compatible, and read-only"

      - name: Restore exact prior traffic after rollback failure
        if: always() && steps.rollback_state.outcome == 'success' && hashFiles('rollback-shift-attempted') != '' && steps.verify_rollback.outcome != 'success'
        run: |
          set -euo pipefail
          RESTORE_STATUS=0
          python scripts/containerapp_rollout.py apply-traffic \
            --input pre-rollback-traffic-manifest.json \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --actual-output restored-traffic.json || RESTORE_STATUS=$?
          az containerapp revision show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "${{ steps.revision.outputs.target }}" \
            --query '{name:name,state:properties.runningState,health:properties.healthState,traffic:properties.trafficWeight}' -o json || true
          az containerapp logs show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "${{ steps.revision.outputs.target }}" \
            --tail 100 || true
          if [ "$RESTORE_STATUS" -ne 0 ]; then
            echo "::error::Exact prior traffic restoration failed"
            exit "$RESTORE_STATUS"
          fi
