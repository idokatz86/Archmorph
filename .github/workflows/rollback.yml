name: Manual Rollback

on:
  workflow_dispatch:
    inputs:
      revision_name:
        description: 'Revision name to roll back to (leave empty for previous revision)'
        required: false
        type: string
      traffic_percentage:
        description: 'Traffic percentage to route to the target revision (default: 100)'
        required: false
        default: '100'
        type: string

permissions:
  id-token: write
  contents: read

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  CONTAINER_APP_NAME: ${{ secrets.CONTAINER_APP_NAME }}
  API_URL: ${{ secrets.API_URL }}
  ARCHMORPH_API_KEY: ${{ secrets.ARCHMORPH_API_KEY }}
  ADMIN_KEY: ${{ secrets.ADMIN_KEY }}

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    concurrency:
      group: production-backend-rollout
      cancel-in-progress: false
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Determine rollback revision
        id: revision
        env:
          INPUT_REVISION: ${{ github.event.inputs.revision_name }}
        run: |
          if [ -n "$INPUT_REVISION" ]; then
            echo "target=$INPUT_REVISION" >> "$GITHUB_OUTPUT"
            echo "Using specified revision: $INPUT_REVISION"
          else
            # Get the list of revisions, pick the second one (previous active)
            REVISIONS=$(az containerapp revision list \
              --name "${{ env.CONTAINER_APP_NAME }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "[?properties.active].name" -o tsv)
            
            CURRENT=$(az containerapp revision list \
              --name "${{ env.CONTAINER_APP_NAME }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "[?properties.trafficWeight > \`0\`].name" -o tsv | head -1)

            PREVIOUS=$(echo "$REVISIONS" | grep -v "^$CURRENT$" | head -1)
            
            if [ -z "$PREVIOUS" ]; then
              echo "::error::No previous revision found for rollback"
              exit 1
            fi
            echo "target=$PREVIOUS" >> "$GITHUB_OUTPUT"
            echo "Rolling back to previous revision: $PREVIOUS (current: $CURRENT)"
          fi

      - name: Verify target schema compatibility before activation
        env:
          ROLLBACK_TARGET: ${{ steps.revision.outputs.target }}
        run: |
          set -euo pipefail
          REVISION_JSON=$(az containerapp revision show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "$ROLLBACK_TARGET" \
            -o json)
          TARGET_SCHEMA_MIN=$(echo "$REVISION_JSON" | jq -r \
            '.properties.template.containers[0].env[] | select(.name=="APP_SCHEMA_MIN_REVISION") | .value // ""')
          TARGET_SCHEMA_MAX=$(echo "$REVISION_JSON" | jq -r \
            '.properties.template.containers[0].env[] | select(.name=="APP_SCHEMA_MAX_REVISION") | .value // ""')
          TARGET_FQDN=$(echo "$REVISION_JSON" | jq -r '.properties.fqdn // ""')
          if [ -z "$TARGET_SCHEMA_MIN" ] || [ -z "$TARGET_SCHEMA_MAX" ] || [ -z "$TARGET_FQDN" ]; then
            echo "::error::Rollback target lacks APP_SCHEMA_MIN_REVISION, APP_SCHEMA_MAX_REVISION, or revision FQDN metadata"
            exit 1
          fi

          TARGET_ACTIVE=$(echo "$REVISION_JSON" | jq -r '.properties.active // false')
          if [ "$TARGET_ACTIVE" != "true" ]; then
            echo "Rollback target is inactive; activating it at zero traffic for schema preflight"
            az containerapp revision activate \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --revision "$ROLLBACK_TARGET"
          fi

          COMPATIBILITY_CODE="000"
          for attempt in $(seq 1 20); do
            if ! COMPATIBILITY_CODE=$(curl -sS -o schema-compatibility.json -w "%{http_code}" \
              --max-time 30 "https://${TARGET_FQDN}/api/schema-compatibility"); then
              COMPATIBILITY_CODE="000"
            fi
            if [ "$COMPATIBILITY_CODE" = "200" ] || [ "$COMPATIBILITY_CODE" = "409" ]; then
              break
            fi
            if [ "$attempt" -lt 20 ]; then
              sleep 10
            fi
          done
          if [ "$COMPATIBILITY_CODE" != "200" ]; then
            echo "::error::Target revision schema preflight returned HTTP ${COMPATIBILITY_CODE}; traffic remains unchanged"
            [ -s schema-compatibility.json ] && cat schema-compatibility.json || true
            if [ "$TARGET_ACTIVE" != "true" ]; then
              az containerapp revision deactivate \
                --name "$CONTAINER_APP_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --revision "$ROLLBACK_TARGET" || true
            fi
            exit 1
          fi
          CURRENT_SCHEMA=$(jq -er '.current_revision' schema-compatibility.json)
          if ! jq -e --arg current "$CURRENT_SCHEMA" --arg minimum "$TARGET_SCHEMA_MIN" --arg maximum "$TARGET_SCHEMA_MAX" '
            .status == "compatible"
            and .current_revision == $current
            and (.accepted_revisions | index($current) != null)
            and .minimum_revision == $minimum
            and .maximum_revision == $maximum
          ' schema-compatibility.json >/dev/null; then
            echo "::error::Target revision is incompatible with the current database schema; traffic remains unchanged"
            if [ "$TARGET_ACTIVE" != "true" ]; then
              az containerapp revision deactivate \
                --name "$CONTAINER_APP_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --revision "$ROLLBACK_TARGET" || true
            fi
            exit 1
          fi
          echo "Rollback target supports current schema ${CURRENT_SCHEMA}; activation may proceed"

      - name: Activate rollback revision
        run: |
          az containerapp revision activate \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --revision ${{ steps.revision.outputs.target }}

      - name: Shift traffic to rollback revision
        env:
          INPUT_TRAFFIC: ${{ github.event.inputs.traffic_percentage || '100' }}
          ROLLBACK_TARGET: ${{ steps.revision.outputs.target }}
        run: |
          az containerapp ingress traffic set \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --revision-weight "$ROLLBACK_TARGET=$INPUT_TRAFFIC"
          echo "Shifted ${INPUT_TRAFFIC}% traffic to $ROLLBACK_TARGET"

      - name: Verify rollback health
        run: |
          echo "Waiting 30s for revision to stabilize..."
          sleep 30
          BASE="${API_URL%/}"
          BASE="${BASE%/api}"
          HEALTH_API_KEY="${ARCHMORPH_API_KEY:-${ADMIN_KEY:-}}"
          _CURL_ARGS=(-sS --max-time 30)
          if [ -n "$HEALTH_API_KEY" ]; then
            _CURL_ARGS+=(-H "X-API-Key: ${HEALTH_API_KEY}")
          fi
          if ! HTTP_CODE=$(curl "${_CURL_ARGS[@]}" -o health.json -w "%{http_code}" "${BASE}/api/health"); then
            echo "::error::Health check curl failed after rollback"
            cat health.json || true
            exit 1
          fi
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Health check returned HTTP ${HTTP_CODE} after rollback"
            cat health.json || true
            exit 1
          fi
          HEALTH=$(jq -r '.status' health.json)
          VERSION=$(jq -r '.version' health.json)
          if [ "$HEALTH" != "healthy" ]; then
            echo "::error::Health check failed after rollback: $HEALTH"
            cat health.json || true
            exit 1
          fi
          echo "Rollback successful — version: $VERSION, status: $HEALTH"
