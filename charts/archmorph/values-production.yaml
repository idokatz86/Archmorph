# Production environment overrides
replicaCount: 3

image:
  # Digest MUST be set by CI/CD: --set-string image.digest=sha256:<digest>
  tag: ""
  digest: ""
  pullPolicy: Always

env:
  ENVIRONMENT: "prod"
  ENFORCE_POSTGRES: "true"
  REQUIRE_REDIS: "true"
  RATE_LIMIT_ENABLED: "true"
  ARCHMORPH_API_KEY_ALLOW_LEGACY_OVERLAP: "false"
  ALLOWED_ORIGINS: "https://frontend.example.com"

resources:
  limits:
    cpu: "1"
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
  hosts:
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: example-api-tls
      hosts:
        - api.example.com

externalSecrets:
  enabled: true
  secretStoreRef:
    name: example-secret-store
    kind: SecretStore
  data:
    - secretKey: AZURE_OPENAI_API_KEY
      remoteRef:
        key: openai-api-key
    - secretKey: DATABASE_URL
      remoteRef:
        key: database-url
    - secretKey: REDIS_URL
      remoteRef:
        key: redis-url
    - secretKey: APPLICATIONINSIGHTS_CONNECTION_STRING
      remoteRef:
        key: appinsights-connection-string
    - secretKey: ARCHMORPH_ADMIN_KEY
      remoteRef:
        key: admin-key
    - secretKey: ARCHMORPH_API_KEY
      remoteRef:
        key: api-key
    - secretKey: ARCHMORPH_API_KEY_ROTATED
      remoteRef:
        key: api-key-rotated
    - secretKey: ARCHMORPH_API_KEY_PRINCIPAL_ID
      remoteRef:
        key: api-key-principal-id
    - secretKey: JWT_SECRET
      remoteRef:
        key: jwt-secret

requiredSecretKeys:
  - secretKey: AZURE_OPENAI_API_KEY
  - secretKey: DATABASE_URL
  - secretKey: REDIS_URL
  - secretKey: APPLICATIONINSIGHTS_CONNECTION_STRING
  - secretKey: ARCHMORPH_ADMIN_KEY
  - secretKey: ARCHMORPH_API_KEY
  - secretKey: ARCHMORPH_API_KEY_ROTATED
  - secretKey: ARCHMORPH_API_KEY_PRINCIPAL_ID
  - secretKey: JWT_SECRET

optionalSecretKeys: []

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/api/admin/monitoring"
