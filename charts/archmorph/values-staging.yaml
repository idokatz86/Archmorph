# Staging environment overrides
replicaCount: 2

image:
  tag: "staging"

env:
  ENVIRONMENT: "staging"
  ENFORCE_POSTGRES: "true"
  REQUIRE_REDIS: "true"
  RATE_LIMIT_ENABLED: "true"
  ALLOWED_ORIGINS: "https://frontend.example.com"

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
  hosts:
    - host: api-staging.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: example-staging-api-tls
      hosts:
        - api-staging.example.com

externalSecrets:
  enabled: true
  secretStoreRef:
    name: example-staging-secret-store
    kind: SecretStore
  data:
    - secretKey: AZURE_OPENAI_API_KEY
      remoteRef:
        key: openai-api-key
    - secretKey: DATABASE_URL
      remoteRef:
        key: database-url
    - secretKey: REDIS_URL
      remoteRef:
        key: redis-url
    - secretKey: APPLICATIONINSIGHTS_CONNECTION_STRING
      remoteRef:
        key: appinsights-connection-string
    - secretKey: ARCHMORPH_ADMIN_KEY
      remoteRef:
        key: admin-key
    - secretKey: ARCHMORPH_API_KEY
      remoteRef:
        key: api-key
    - secretKey: JWT_SECRET
      remoteRef:
        key: jwt-secret
