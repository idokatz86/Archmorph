{{- if and .Values.migrations.enabled (eq .Values.migrations.phase "preflight") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "archmorph.fullname" . }}-preflight-{{ include "archmorph.migrationExecutionId" . }}
  labels:
    {{- include "archmorph.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration-secret-preflight
  annotations:
    archmorph.io/release-phase: preflight
spec:
  ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished }}
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.migrations.secretPreflightTimeoutSeconds }}
  template:
    metadata:
      labels:
        {{- include "archmorph.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration-secret-preflight
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.migrations.serviceAccountName | quote }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: verify-database-schema
          image: {{ include "archmorph.image" . | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["python", "run_migrations.py"]
          args:
            - {{ include "archmorph.migrationRuntimeEnvelope" (dict "root" . "mode" "preflight") | quote }}
          workingDir: /app
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "archmorph.secretName" $ }}
                  key: DATABASE_URL
                  optional: false
            - name: ENVIRONMENT
              value: {{ .Values.env.ENVIRONMENT | quote }}
            - name: EXPECTED_ALEMBIC_HEAD
              value: {{ .Values.migrations.expectedAlembicHead | quote }}
            - name: MIGRATION_IMAGE_REFERENCE
              value: {{ include "archmorph.image" . | quote }}
{{- end }}
