{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "archmorph.fullname" . }}-secret-preflight-{{ .Release.Revision }}
  labels:
    {{- include "archmorph.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration-secret-preflight
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.migrations.secretPreflightTimeoutSeconds }}
  template:
    metadata:
      labels:
        {{- include "archmorph.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration-secret-preflight
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.migrations.serviceAccountName | quote }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: verify-runtime-secret
          image: {{ include "archmorph.image" . | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - python
            - -c
            - |
              import os
              secret_name = {{ include "archmorph.secretName" . | quote }}
              required = {{ .Values.requiredSecretKeys | toJson }}
              missing = [item["secretKey"] for item in required if not os.environ.get(item["secretKey"])]
              if missing:
                  raise SystemExit(
                      f'runtime secret "{secret_name}" is not materialized or is missing required keys: '
                      f'{", ".join(missing)}; reconcile ExternalSecret or create existingSecret before Helm migration'
                  )
              print("runtime secret preflight succeeded")
          env:
            {{- range .Values.requiredSecretKeys }}
            - name: {{ .secretKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "archmorph.secretName" $ }}
                  key: {{ .secretKey }}
                  optional: true
            {{- end }}
{{- end }}