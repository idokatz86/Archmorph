{{- if .Values.externalSecrets.enabled }}
{{- $keys := list }}
{{- range .Values.externalSecrets.data }}
{{- $keys = append $keys .secretKey }}
{{- end }}

{{- range $required := .Values.requiredSecretKeys }}
{{- if not (has $required.secretKey $keys) }}
{{- fail (printf "externalSecrets.data must map required key %s" $required.secretKey) }}
{{- end }}
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "archmorph.fullname" . }}-secrets
  labels:
    {{- include "archmorph.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ required "externalSecrets.secretStoreRef.name is required" .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ required "externalSecrets.secretStoreRef.kind is required" .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "archmorph.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    {{- toYaml .Values.externalSecrets.data | nindent 4 }}
{{ end -}}
{{- /* Required runtime secret materialization is fail-closed. */ -}}

